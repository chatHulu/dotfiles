# === Responsiveness ===
set -sg escape-time 0           # no delay on Esc/meta keys (was 500ms)
set -g repeat-time 500          # faster repeat for prefix+bind keys
set -g display-time 2000        # shorter status messages
set -g status-interval 1        # status bar refreshes faster
set -g set-titles on            # terminal window title syncs instantly
set -g focus-events on          # focus-in/focus-out for modern terminals

# === True Color (no fallback flicker) ===
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# === Mouse ===
set -g mouse on                 # scroll, click pane, resize with mouse

# === Vim Keys ===
set -g mode-keys vi             # vi keys in copy/scroll mode

# === Sensible Splits ===
bind v split-window -h -c "#{pane_current_path}"   # prefix-v: vertical split at cwd
bind s split-window -v -c "#{pane_current_path}"   # prefix-s: horizontal split at cwd

# === Fast Reload ===
bind r source-file ~/.tmux.conf \; display "reloaded ✓"

# === Scroll & History ===
set -g history-limit 50000        # big scrollback buffer
bind -T copy-mode-vi WheelUpPane \
  send-keys -X scroll-up
bind -T copy-mode-vi WheelDownPane \
  send-keys -X scroll-down

# === Pane Navigation (no prefix) ===
bind -n M-h select-pane -L        # Alt+h ←
bind -n M-j select-pane -D        # Alt+j ↓
bind -n M-k select-pane -U        # Alt+k ↑
bind -n M-l select-pane -R        # Alt+l →

# === Pane Resize (prefix + arrows) ===
bind -r H resize-pane -L 5        # prefix H: shrink left
bind -r J resize-pane -D 5        # prefix J: shrink down
bind -r K resize-pane -U 5        # prefix K: shrink up
bind -r L resize-pane -R 5        # prefix L: shrink right

# === Natural Indexing ===
set -g base-index 1               # windows start at 1
setw -g pane-base-index 1         # panes start at 1

# === Activity Alerts ===
set -g monitor-activity on
set -g visual-activity on         # highlight window with output

# === Clipboard (Linux) ===
set -g set-clipboard on
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -sel clip -i 2>/dev/null || xsel -ib 2>/dev/null"

# === Status Bar: Minimal & Fast ===
set -g status-left-length 20
set -g status-right-length 80
set -g status-left "#[fg=colour243]#S "
set -g status-right "#[fg=colour243]%Y-%m-%d %H:%M #[fg=colour75]#H"
set -g status-style bg=colour236,fg=colour252
